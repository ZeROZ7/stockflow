# Local stack: nginx (web) -> php-fpm (app) -> MySQL (db), plus a one-shot migrate job and a queue worker.
#   docker compose up -d --build        # http://localhost:8000
#   docker compose --profile worker up -d   # also start the queue worker
name: stockflow

x-app: &app
  build:
    context: .
    target: app
  image: stockflow-app:local
  env_file:
    - path: .env.docker
      required: false
  environment: &app-env
    APP_NAME: StockFlow
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_KEY: ${APP_KEY:-base64:c3RvY2tmbG93LWxvY2FsLWRldi1rZXktMzJieXRlcyE=}
    APP_URL: http://localhost:8000
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: stockflow
    DB_USERNAME: stockflow
    DB_PASSWORD: ${DB_PASSWORD:-stockflow}
    SESSION_DRIVER: database
    SESSION_DOMAIN: localhost
    SANCTUM_STATEFUL_DOMAINS: localhost:8000,127.0.0.1:8000
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    TRUSTED_PROXIES: "*"
  depends_on:
    db:
      condition: service_healthy

services:
  migrate:
    <<: *app
    command: ["migrate"]
    environment:
      <<: *app-env
      SEED: ${SEED:-true}
    restart: "no"

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    image: stockflow-web:local
    environment:
      PHP_FPM_HOST: app:9000
    ports:
      - "8000:80"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  worker:
    <<: *app
    profiles: ["worker"]
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: ${DB_PASSWORD:-stockflow}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "33060:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
