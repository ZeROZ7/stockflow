# EXAMPLE ONLY — do not commit real values. Create the real secret with e.g.:
#   kubectl -n stockflow create secret generic stockflow-secrets \
#     --from-literal=APP_KEY="$(docker run --rm stockflow-app:local php -r 'echo "base64:".base64_encode(random_bytes(32));')" \
#     --from-literal=DB_USERNAME=stockflow --from-literal=DB_PASSWORD='change-me'
# (or use Sealed Secrets / External Secrets in a real cluster)
apiVersion: v1
kind: Secret
metadata:
  name: stockflow-secrets
  namespace: stockflow
type: Opaque
stringData:
  APP_KEY: "base64:REPLACE_ME"
  DB_USERNAME: stockflow
  DB_PASSWORD: change-me
