apiVersion: v1
kind: ConfigMap
metadata:
  name: stockflow-config
  namespace: stockflow
data:
  APP_NAME: StockFlow
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://stockflow.example.com
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_HOST: mysql.stockflow.svc.cluster.local
  DB_PORT: "3306"
  DB_DATABASE: stockflow
  SESSION_DRIVER: database
  SESSION_DOMAIN: stockflow.example.com
  SESSION_SECURE_COOKIE: "true"
  SANCTUM_STATEFUL_DOMAINS: stockflow.example.com
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  TRUSTED_PROXIES: "*"
  # nginx and php-fpm share the pod network namespace.
  PHP_FPM_HOST: 127.0.0.1:9000
