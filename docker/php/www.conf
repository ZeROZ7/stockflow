[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
; Pass container env vars (APP_KEY, DB_*, ...) through to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
ping.path = /ping
ping.response = pong
pm.status_path = /fpm-status
